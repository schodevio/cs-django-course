{% extends "blog/base.html" %}

{% block content %}
    {% for post in posts %}
        <article>
            <h3>{{ post.title }}</h3>
            <p>{{ post.content }}</p>
            <footer><small>By {{ post.author }} on {{ post.created_at|date:"F d, Y" }}</small></footer>
        </article>
    {% endfor %}
{% endblock content %}
