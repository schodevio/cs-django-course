{% extends "blog/base.html" %}

{% block content %}
    {% for post in posts %}
        <article class="post">
            <h3>{{ post.title }}</h3>
            <p>{{ post.content }}</p>

            <footer class="post__footer">
                <img src="{{ post.author.profile.image.url }}" alt="Profile Picture" class="post__avatar">
                <span>{{ post.author }} on {{ post.created_at|date:"F d, Y" }}</span>
            </footer>
        </article>
    {% endfor %}
{% endblock content %}
