{% extends "blog/base.html" %}

{% block content %}
    <div class="content-section">
        <form method="POST" class="form">
            {% csrf_token %}
            <fieldset>
                <h2>{{ object.title }}</h2>
                <p>Are you sure you want to delete this post?</p>
            </fieldset>

            <div class="form__actions">
              <button class="error" type="submit">Yes, Delete</button>
              <a href="{% url 'blog_post' object.pk %}" role="button" class="secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock content %}
