{% extends "blog/base.html" %}

{% block content %}
  <section>
    <div class="container">
      <h1>Profile</h1>

      <div class="profile">
        <img src="{{ user.profile.image.url }}" alt="Profile Picture" class="profile__pic">

        <div class="profile__info">
          <p><strong>Username:</strong> {{ user.username }}</p>
          <p><strong>Email:</strong> {{ user.email }}</p>
        </div>
      </div>
    </div>
  </section>
{% endblock content %}
